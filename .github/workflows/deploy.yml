name: Deploy

# Ships main to Fly only after CI passed on that exact commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearse_rollback:
        description: Fail the smoke test on purpose to test the rollback
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # Remember what is live now, so a failed release can go back to it.
      - name: Record the running release
        id: prev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl image show -a report-focus --json > image.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          app = [m for m in json.load(open("image.json")) if m["MachineID"]][0]
          print(f"image={app['Registry']}/{app['Repository']}:{app['Tag']}")
          print(f"sha={json.loads(app.get('Labels') or '{}').get('GH_SHA', '')}")
          PY
          cat "$GITHUB_OUTPUT"
      - name: Deploy
        id: deploy
        run: flyctl deploy --remote-only --ha=false --build-secret DATABASE_AUTH_TOKEN="$DATABASE_AUTH_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      - name: Smoke test
        id: smoke
        run: |
          scripts/smoke.sh https://report-focus.fly.dev
          if [ "${{ inputs.rehearse_rollback }}" = "true" ]; then echo "Rehearsal: failing on purpose."; exit 1; fi
      # The deploy or smoke test failed after the live machine may have changed: put the previous image back,
      # with the fly.toml it ran with. The job still fails, so the bad commit stays red.
      - name: Roll back
        if: failure() && steps.prev.outputs.image != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
          PREV_SHA: ${{ steps.prev.outputs.sha }}
        run: |
          config=fly.toml
          if [ -n "$PREV_SHA" ] && git fetch -q --depth=1 origin "$PREV_SHA"; then
            git show "$PREV_SHA:fly.toml" > fly.rollback.toml && config=fly.rollback.toml
          fi
          echo "Rolling back to $PREV_IMAGE (config from ${PREV_SHA:-this commit})"
          flyctl deploy --image "$PREV_IMAGE" --config "$config" --ha=false
          scripts/smoke.sh https://report-focus.fly.dev
