# Fly.io settings for Report Focus News. Deploy steps are in the README under "Deploying on Fly.io".
app = "report-focus"
primary_region = "lhr"
# Disk-backed overflow so a memory spike slows the site down instead of freezing it.
swap_size_mb = 512

[build.args]
  DATABASE_URL = "libsql://report-focus-sambulosenda.aws-eu-west-1.turso.io"
  SITE_URL = "https://reportfocusnews.com"
  S3_PUBLIC_URL = "https://media.reportfocusnews.com"
  SITE_TIMEZONE = "Africa/Harare"
  NEXT_PUBLIC_SITE_TIMEZONE = "Africa/Harare"
  # A Sentry DSN is public by design: browsers send errors with it.
  NEXT_PUBLIC_SENTRY_DSN = "https://697f8934083c64a2777c7c32a2327015@o4507288629608448.ingest.de.sentry.io/4512353132478544"
  UMAMI_WEBSITE_ID = "7cb6e107-aea7-414c-8061-39795bbf480c"
  WHATSAPP_CHANNEL_URL = "https://whatsapp.com/channel/0029VaAG1nY9WtC0hdfiVb1V"

[env]
  DATABASE_URL = "libsql://report-focus-sambulosenda.aws-eu-west-1.turso.io"
  SITE_URL = "https://reportfocusnews.com"
  S3_PUBLIC_URL = "https://media.reportfocusnews.com"
  S3_REGION = "auto"
  SITE_TIMEZONE = "Africa/Harare"
  NEXT_PUBLIC_SITE_TIMEZONE = "Africa/Harare"
  SENTRY_DSN = "https://697f8934083c64a2777c7c32a2327015@o4507288629608448.ingest.de.sentry.io/4512353132478544"
  EMAIL_PROVIDER = "console"
  SENTRY_ENVIRONMENT = "production"
  # Caps the server's memory so it crashes and Fly restarts it, instead of hanging once the 1 GB machine fills up.
  # SIGUSR2 writes a heap snapshot to /app for leak hunting. Taking one briefly needs about as much memory again as the heap holds.
  NODE_OPTIONS = "--max-old-space-size=640 --heapsnapshot-signal=SIGUSR2"
  # Umami visitor stats (cloud.umami.is). The ID is public: it is in every page's script tag.
  UMAMI_WEBSITE_ID = "7cb6e107-aea7-414c-8061-39795bbf480c"
  # Public channel invite. Readers join with one tap.
  WHATSAPP_CHANNEL_URL = "https://whatsapp.com/channel/0029VaAG1nY9WtC0hdfiVb1V"

# Checks settings on a throwaway machine with the new image and secrets. A failure stops the deploy before the live
# machine is touched. Blue-green deploys would also catch crashing code, but Fly doesn't allow them with a volume.
[deploy]
  release_command = "npx tsx scripts/check-env.ts"

[processes]
  app = "npx next start -H 0.0.0.0 -p 3000"
  cron = "/app/deploy/cron.sh"

# Resized pictures survive deploys, so a new release doesn't re-encode the whole archive on first visit.
# Create once: fly volumes create image_cache -r lhr -s 1
[mounts]
  source = "image_cache"
  destination = "/app/.next/cache/images"
  processes = ["app"]

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always on: page caches and the view counter live in its memory.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["cron"]
